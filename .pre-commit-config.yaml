repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args: ["--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  # Denylist gate: patterns from DENYLIST_PATTERNS or ~/.config/dms-orchestration/denylist,
  # never from the repository. Install the commit-msg stage too:
  #   pre-commit install --hook-type pre-commit --hook-type commit-msg
  - repo: local
    hooks:
      - id: denylist
        name: denylist (staged files)
        entry: uv run python scripts/check_denylist.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: denylist-commit-msg
        name: denylist (commit message)
        entry: uv run python scripts/check_denylist.py --commit-msg
        language: system
        stages: [commit-msg]
