[project]
name = "dms-orchestration"
version = "0.1.0"
description = "AWS DMS orchestration on Step Functions: Lambda code, job runner, CLI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "boto3>=1.35",
  "moto[dynamodb,s3,ssm,sns,stepfunctions]>=5.0",
  "pytest>=8",
  "pytest-cov>=5",
  "jsonschema>=4.23",
  "pyyaml>=6",
  "jsonata-python>=0.5",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src", "src/jobs/sql-runner", "scripts"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
# Fetched by `sandbox.py fetch-upstream`, not ours (gitignored).
extend-exclude = ["examples/sandbox/upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S311"]

[tool.coverage.run]
source = ["src/shared", "src/lambdas"]
