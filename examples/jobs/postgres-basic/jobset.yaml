# Example job set: one PostgreSQL source -> one Aurora PostgreSQL target, full load.
#
# Connections are registered in Terraform (projects.<p>.tasks.<t>.connections), by name:
#   source      migration_runner on the source (SELECT on schema app)
#   target      migration_runner on the target (DDL on schema app, owner of the tables)
#   dms_source  the DMS source endpoint user (for the grants check; Data API enabled on the source)
#
# Upload: scripts/sync-jobs.sh ledger <git-sha> examples/jobs/postgres-basic
schemaVersion: 1
description: PostgreSQL full load with schema diff, table creation, indexes/FK after load and row-count check

defaults:
  runtime: fargate
  image: sql-runner
  timeoutSeconds: 3600
  retry: { maxAttempts: 1, backoffSeconds: 60 }
  idempotent: true
  onError: fail

phases:
  pre:
    - name: check-connections
      description: DMS endpoint connection tests were successful
      handler: builtin:checks/connections
      onError: warn

    - name: check-source-grants
      description: the DMS user can read schema app (Data API on the source cluster)
      handler: builtin:checks/postgresql_source_grants
      with:
        connection: dms_source
        schemas: [app]
        require: [SELECT]

    - name: schema-diff
      description: compare tables and columns of schema app between source and target
      command: [python3, scripts/diff_schema.py, --source, source, --target, target, --schema, app]
      artifacts: { upload: [/out/diff.json] }

    - name: create-tables
      description: create missing tables (no secondary indexes or FK before the load)
      command: [psql-run, --connection, target, --file, ddl/010_schema_and_tables.sql, --single-transaction]
      when: "pre.schema-diff.summary.missingTables > 0"

  reset:
    - name: truncate-tables
      description: empty partially loaded tables (resume) or all tables (reload-target) to avoid duplicates
      command: [psql-run, --connection, target, --truncate, "{{ ctx.resetTables }}"]
      retry: { maxAttempts: 2, backoffSeconds: 30 }

  post:
    - name: indexes-and-foreign-keys
      command: [psql-run, --connection, target, --file, ddl/020_indexes.sql, --file, ddl/030_foreign_keys.sql]
      timeoutSeconds: 14400

    - name: sync-sequences
      command: [psql-run, --connection, target, --file, ddl/040_sync_sequences.sql]

    - name: row-counts
      description: row counts must match between source and target
      command: [python3, scripts/row_counts.py, --source, source, --target, target, --schema, app]
      artifacts: { upload: [/out/row_counts.json] }

    - name: cleanup-control-tables
      description: DMS control tables are not needed after a full load
      handler: builtin:cleanup/drop_control_tables
      with: { connection: target, schema: dms_control }
      when: "ctx.migrationType == 'full-load' and not run.dryRun"
      onError: warn

  on_failure:
    - name: collect-diagnostics
      handler: builtin:diagnostics/dms_dump
      onError: continue
